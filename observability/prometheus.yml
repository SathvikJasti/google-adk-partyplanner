global:
  scrape_interval: 15s

# Metrics arrive over OTLP from the collector. Promote these resource
# attributes to labels so dashboards can filter by service.
otlp:
  promote_resource_attributes:
    - service.name
    - service.namespace
    - deployment.environment

storage:
  tsdb:
    out_of_order_time_window: 30m

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
